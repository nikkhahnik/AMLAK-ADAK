name: Validate ADAAK static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site entry points and editable property catalogue
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f property.html
          test -f privacy.html
          test -f qr.html
          test -f admin/index.html
          test -f .pages.yml
          test -f netlify.toml
          test -f properties.json
          test -d assets
          python3 -m json.tool properties.json >/dev/null
          echo "ADAAK static structure and property JSON validated"
