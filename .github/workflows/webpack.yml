name: Validate ADAAK static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical URLs and public assets
        run: python3 scripts/build_seo.py
      - name: Check intake JavaScript
        run: |
          node --check brand-intake.js
          node --test tests/intake.test.mjs
      - name: Check shared-host intake PHP
        run: php -l api/submit/index.php
      - name: Prepare exact offline preview
        run: |
          mkdir -p preview
          cp -r assets bazdid-360 darkhast-melk sabt-file tour daftar-amlak-karaj kharid-apartman-rajaei-shahr forosh-melk-karaj rahnama-bazdid-apartman preview/
          cp index.html privacy.html styles.css brand-refactor.css app.js theme.js home-header.js brand-intake.js preview/
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" http://localhost:8080\r\npython -m http.server 8080 --bind 127.0.0.1\r\n' > preview/start-preview.bat
          printf 'Run start-preview.bat with Python installed, or run python3 -m http.server 8080 --bind 127.0.0.1 inside this folder and open http://localhost:8080. Preview forms never send data.\n' > preview/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ADAK-exact-preview
          path: preview/
          retention-days: 14
