[build]
  publish = "."

[build.environment]
  # This is a static HTML site, not a Next.js app. Prevent the Next.js Runtime
  # (installed automatically) from running and failing the build.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/property/019"
  to = "/property.html"
  status = 301

[[redirects]]
  from = "/property/boustan-19"
  to = "/property.html"
  status = 301

[[redirects]]
  from = "/p/*"
  to = "/property.html?slug=:splat"
  status = 200
