<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بارگذاری تصاویر | آداک</title><style>
:root{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#112f44}*{box-sizing:border-box}body{margin:0;line-height:1.8}.wrap{width:min(780px,calc(100% - 25px));margin:32px auto}h1{font-size:26px}.panel{background:#fff;border:1px solid #e0e5e9;padding:24px;border-radius:16px;margin:15px 0}p,.muted{font-size:13px;color:#657580}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:bold}input,button{font:inherit}input{padding:12px;border:1px solid #cbd5db;border-radius:9px;width:100%;background:white;color:#102a40}input:focus-visible,button:focus-visible{outline:3px solid #d3b27b}button,.button{display:inline-flex;border:1px solid #cbd5db;border-radius:9px;padding:11px 18px;background:#fff;color:#102a40;cursor:pointer;font-weight:bold;text-decoration:none;font-size:13px}button.primary{background:#102a40;color:white}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.note{background:#fff8e9;border-right:3px solid #ae9363;padding:12px;border-radius:8px;font-size:12px}#msg{min-height:24px;font-size:13px}#preview{width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:15px;background:#f1f4f6}[hidden]{display:none!important}</style></head>
<body><div class="wrap"><a class="button" href="/admin/">بازگشت به داشبورد</a><h1>بارگذاری تصاویر ملک</h1><p>این صفحه برای همکارانی است که فقط مجوز بارگذاری دارند. امکان توقف بارگذاری در حال انجام وجود دارد، اما حذف تصویر ثبت‌شده مجوز جداگانه می‌خواهد.</p>
<div class="note" id="status">در حال بررسی اتصال…</div>
<section class="panel" id="login"><h2>ورود همکار</h2><form id="login-form"><label for="email">ایمیل</label><input type="email" id="email" autocomplete="username" required><label for="password">رمز عبور</label><input type="password" id="password" autocomplete="current-password" required><div class="buttons"><button class="primary">ورود</button></div></form></section>
<section class="panel" id="upload" hidden><h2>ثبت تصویر</h2><form id="form"><label for="listing-id">شناسه UUID ملک</label><input id="listing-id" required pattern="[0-9a-fA-F-]{36}" placeholder="شناسه پرونده ملکی که مدیر به شما داده"><label for="file">عکس انتخابی (WebP، حداکثر ۶ مگابایت)</label><input id="file" type="file" accept="image/webp" required><img id="preview" hidden alt="پیش‌نمایش تصویر"><label for="caption">توضیح تصویر</label><input id="caption" maxlength="160" placeholder="مثلاً پذیرایی، نمای جنوبی"><div class="buttons"><button type="submit" id="start" class="primary">شروع بارگذاری</button><button type="button" id="cancel" disabled>لغو بارگذاری</button></div></form></section>
<p id="msg" role="status" aria-live="polite"></p></div><script src="/backend-config.js"></script><script src="/backend.js"></script><script>
(()=>{'use strict';const B=window.ADAAK_BACKEND,$=s=>document.getElementById(s);let controller=null,objectUrl=null;
const msg=t=>$('msg').textContent=t;
async function boot(){if(!B?.ready){$('status').textContent='اتصال پایگاه داده اختصاصی آداک تنظیم نشده؛ بارگذاری غیرفعال است.';return}try{const u=await B.ensureSession();if(!u)return;const r=await B.rest('adak_staff','select=permissions,is_owner,is_active&user_id=eq.'+encodeURIComponent(u.id));const s=r[0];if(!s||!s.is_active||!(s.is_owner||(s.permissions||[]).includes('media.upload'))){$('login').hidden=true;$('status').textContent='این حساب مجوز بارگذاری ندارد.';return}$('login').hidden=true;$('upload').hidden=false;$('status').textContent='حساب مجاز شناسایی شد. تصاویر ابتدا خصوصی ثبت می‌شوند و بدون تأیید مدیر منتشر نمی‌شوند.'}catch(e){msg(e.message)}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();try{await B.signIn($('email').value,$('password').value);$('password').value='';await boot()}catch(err){msg(err.message)}});
$('file').addEventListener('change',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);const f=$('file').files[0];$('preview').hidden=!f;if(f){objectUrl=URL.createObjectURL(f);$('preview').src=objectUrl}});
$('cancel').addEventListener('click',()=>{if(controller){controller.abort();msg('درخواست توقف بارگذاری ارسال شد. اگر انتقال قبلاً به سرور رسیده باشد، ممکن است فایل باقی مانده باشد.')}})
$('form').addEventListener('submit',async e=>{e.preventDefault();const file=$('file').files[0];if(!file||file.type!=='image/webp'||file.size>6291456){msg('لطفاً فایل WebP کمتر از ۶ مگابایت انتخاب کنید.');return}if(controller)return;const listing=$('listing-id').value.trim(),path='incoming/'+crypto.randomUUID()+'.webp';controller=new AbortController();$('start').disabled=true;$('cancel').disabled=false;msg('بارگذاری آغاز شد…');try{await B.uploadPhoto(path,file,controller.signal);$('cancel').disabled=true;await B.rest('adak_listing_photos','','POST',{listing_id:listing,storage_path:path,media_kind:'original',alt_text:$('caption').value.trim(),is_public:false});msg('تصویر به پرونده اضافه شد و خصوصی باقی مانده است. انتشار فقط با مجوز مدیر انجام می‌شود.');$('form').reset();$('preview').hidden=true}catch(err){msg(err.name==='AbortError'?'بارگذاری از سمت مرورگر متوقف شد. وضعیت نهایی فایل را مدیر بررسی کند.':'ثبت کامل نشد: '+err.message+'؛ در صورت انتقال موفق فایل، ممکن است تصویر بدون اتصال به پرونده باقی مانده باشد.')}finally{controller=null;$('start').disabled=false;$('cancel').disabled=true}});
boot()})();
</script></body></html>
