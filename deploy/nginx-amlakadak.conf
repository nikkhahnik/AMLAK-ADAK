# generated by scripts/build_seo.py - do not edit by hand
# nginx + php-fpm equivalent of .htaccess (for a VPS, not shared hosting)
# put this in /etc/nginx/sites-available/ and symlink it into sites-enabled/

server {
  listen 80;
  listen [::]:80;
  server_name amlakadak.ir www.amlakadak.ir;
  return 301 https://amlakadak.ir$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.amlakadak.ir;
  # certbot fills in the certificate lines here
  return 301 https://amlakadak.ir$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name amlakadak.ir;
  root /var/www/amlakadak;
  index index.html;
  charset utf-8;
  # certbot fills in the certificate lines here

  # security headers (same values as _headers)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  error_page 404 /404.html;

  # long cache for versioned assets
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # admin panel must never be indexed or cached
  location ^~ /admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    location ~ ^/admin/config.*\.php$ { deny all; }
    try_files $uri $uri/ =404;
  }

  # admin API
  location ^~ /api/admin/ {
    # settings file must never be served, only read by PHP
    location ~ ^/api/admin/config.*\.php$ { deny all; }
    try_files /api/admin/index.php =404;
  }
  location = /api/admin/index.php {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php-fpm.sock;
  }

  # legacy listing URLs
  location = /property/019          { return 301 /p/adk-019; }
  location = /property/boustan-19   { return 301 /p/adk-019; }

  # one rule per published listing (clean URL, with or without trailing slash)
  location = /p/adk-019  { try_files /property.html =404; }
  location = /p/adk-019/ { try_files /property.html =404; }
  location = /p/adk-03  { try_files /p/adk-03.html =404; }
  location = /p/adk-03/ { try_files /p/adk-03.html =404; }
  location = /p/adk-02  { try_files /p/adk-02.html =404; }
  location = /p/adk-02/ { try_files /p/adk-02.html =404; }
  location = /p/baghestan-93m  { try_files /p/baghestan-93m.html =404; }
  location = /p/baghestan-93m/ { try_files /p/baghestan-93m.html =404; }
  location = /p/adk-05  { try_files /p/adk-05.html =404; }
  location = /p/adk-05/ { try_files /p/adk-05.html =404; }
  location = /p/adk-06  { try_files /p/adk-06.html =404; }
  location = /p/adk-06/ { try_files /p/adk-06.html =404; }

  # anything else under /p/ is a real 404
  location ^~ /p/ { try_files $uri =404; }

  # keep sources and secrets out of the web root
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(py|mjs|sql|md|toml)$ { deny all; }
  location ~ ^/(_headers|_redirects)$ { deny all; }

  # no PHP anywhere except the admin API
  location ~ \.php$ { deny all; }

  location / { try_files $uri $uri/ =404; }

  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;
}
